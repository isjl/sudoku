<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sudoku Drills</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2312151c'/%3E%3Cpath d='M11 4v24M21 4v24M4 11h24M4 21h24' stroke='%237aa2ff' stroke-width='2'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-mode="drill">
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="6" /><path d="M8.3 3v18M15.7 3v18M3 8.3h18M3 15.7h18" /></svg>
        <span>Sudoku Drills</span>
      </div>
      <nav class="modes" id="modes" aria-label="Mode">
        <button data-mode="drill">Drills</button>
        <button data-mode="play">Play</button>
      </nav>
      <div class="keys" id="keys"></div>
    </header>

    <main class="layout">
      <section class="board-col">
        <div class="board-frame">
          <div class="col-labels" id="col-labels"></div>
          <div class="row-labels" id="row-labels"></div>
          <div class="board" id="board">
            <div class="cells" id="cells"></div>
            <svg class="grid-lines" id="grid-lines" viewBox="0 0 900 900" preserveAspectRatio="none" aria-hidden="true"></svg>
            <svg class="links" id="links" viewBox="0 0 900 900" preserveAspectRatio="none" aria-hidden="true"></svg>
            <div class="loading" id="loading">
              <div class="spinner"></div>
              <div class="loading-text" id="loading-text">Generating…</div>
            </div>
          </div>
        </div>
        <div class="digitbar" id="digitbar"></div>

        <div class="playbar play-only" id="playbar">
          <button class="pbtn" data-act="undo" title="Undo (U)">
            <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></svg><span>Undo</span>
          </button>
          <button class="pbtn" data-act="erase" title="Erase (Backspace)">
            <svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L11 21" /><path d="M22 21H7" /><path d="m5 11 9 9" /></svg><span>Erase</span>
          </button>
          <button class="pbtn" data-act="notes" title="Notes mode (N)">
            <svg viewBox="0 0 24 24"><path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" /></svg><span>Notes</span>
          </button>
          <button class="pbtn" data-act="biv" title="Highlight bivalue cells (B)">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3" /><circle cx="9" cy="12" r="1.6" /><circle cx="15" cy="12" r="1.6" /></svg><span>Bivalue</span>
          </button>
          <button class="pbtn hint-btn" data-act="hint" title="Hint (H)">
            <svg viewBox="0 0 24 24"><path d="M9 18h6" /><path d="M10 22h4" /><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2Z" /></svg><span>Hint</span>
          </button>
        </div>
        <div class="card hintcard play-only" id="hintcard" hidden></div>
      </section>

      <aside class="panel">
        <!-- Drills -->
        <div class="card drill-only">
          <div class="eyebrow">Technique</div>
          <div class="levels" id="levels"></div>
          <div class="techs" id="techs"></div>
        </div>

        <div class="card task drill-only">
          <div class="eyebrow">Find the</div>
          <h1 id="task-title">X-Wing</h1>
          <p class="task-sub" id="task-sub"></p>
          <div class="progress">
            <div class="dots" id="dots"></div>
            <div class="meta">
              <span id="timer">0:00</span>
              <span id="mistakes"></span>
            </div>
          </div>
          <div class="actions">
            <button class="btn" id="hint">Hint</button>
            <button class="btn" id="reveal">Reveal</button>
            <button class="btn primary" id="next">Skip</button>
          </div>
          <div class="feedback" id="feedback"></div>
        </div>

        <details class="card howto drill-only" id="howto-card">
          <summary>How it works</summary>
          <p id="howto"></p>
        </details>

        <div class="card stats drill-only" id="stats"></div>

        <!-- Play -->
        <div class="card play-only">
          <div class="eyebrow">Difficulty</div>
          <div class="diffs" id="diffs"></div>
          <button class="btn new-game" id="new-game">New game</button>
        </div>

        <div class="card game play-only" id="game-card">
          <div class="game-head">
            <h1 id="game-title">Medium</h1>
            <div class="meta">
              <span id="p-timer">0:00</span>
              <span id="p-mistakes"></span>
            </div>
          </div>
          <p class="task-sub" id="game-sub"></p>
          <div class="feedback" id="game-feedback"></div>
        </div>

        <div id="hint-slot" class="play-only"></div>
        <div class="card stats play-only" id="p-stats"></div>
      </aside>
    </main>
  </div>

  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
